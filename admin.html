<!DOCTYPE html>
<html>
<head>
  <title>Admin FOKSI</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<h2>Dashboard Admin</h2>

<h3>Tambah Akun Anggota</h3>
<input id="nama" placeholder="Nama">
<input id="username" placeholder="Username">
<input id="password" placeholder="Password">
<input id="jabatan" placeholder="Jabatan">
<input id="regional" placeholder="Regional">
<input id="sekolah" placeholder="Sekolah">
<button id="tambahAkun">Tambah Akun</button>

<hr>

<h3>Pengaturan Absensi</h3>
<input id="kegiatan" placeholder="Nama Kegiatan">
<input type="date" id="tanggal">
<input type="time" id="buka">
<input type="time" id="tutup">
<button id="setAbsensi">Simpan</button>

<script type="module" src="admin.js"></script>
</body>
</html>
<div class="card dashboard">
  <div class="header">
    <h3><i class="fa-solid fa-user-shield"></i> Dashboard Admin</h3>
    <span class="badge open">Absensi Dibuka</span>
  </div>

  <!-- section tambah akun -->

</div>
