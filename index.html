<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Absensi FOKSI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Absensi FOKSI</h1>
        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" required placeholder="Masukkan Username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="Masukkan Password">
            </div>
            <p id="error-msg" style="color: red; display: none; margin-bottom: 10px; text-align: center;"></p>
            <button type="submit">LOGIN</button>
        </form>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
